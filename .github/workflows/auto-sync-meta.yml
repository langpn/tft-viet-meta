name: Auto-Sync TFT Academy Meta

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: tft-meta-publication
  cancel-in-progress: false

jobs:
  sync-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh the official TFT Academy tier lists
        run: bun run sync:academy

      - name: Verify and build candidate
        run: |
          bun run verify
          bun test
          bun run typecheck
          bun run build
          bunx playwright install --with-deps chromium
          bunx playwright test

      - name: Commit and Push if meta changed
        run: |
          git add src/lib/data/academy-live.json static/llms.txt static/llms-full.txt
          if git diff --cached --quiet; then
            echo "No meta changes detected. Everything is up to date."
          else
            echo "New meta changes found! Committing and pushing to main..."
            git config user.name "Phạm Ngọc Lang"
            git config user.email "langpn.dev@gmail.com"
            git commit -m "chore: sync verified TFT meta data"
            git push origin main
          fi
